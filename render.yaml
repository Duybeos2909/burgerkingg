services:
  - type: web
    name: burgerking-backend
    runtime: node
    plan: free
    rootDir: bk-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: bduy.nina@gmail.com
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
